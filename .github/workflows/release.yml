# Zet APP_VERSION in includes/version.php automatisch gelijk aan een nieuwe
# git-tag (bv. tag "v1.2.0" -> APP_VERSION '1.2.0').
#
# De release-zip die sites via Beheerpaneel → Updates downloaden wordt gebouwd
# vanaf de commit waar de tag naar wijst, dus die commit moet de juiste versie
# bevatten. Daarom: versie-commit (plus, als die veranderd zijn, verse
# Europese IP-ranges in includes/geo/) bovenop de getagde commit maken, de tag daar
# naartoe verplaatsen, main fast-forwarden en (als die nog niet bestaat) de
# GitHub-release aanmaken.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Versie uit tag halen
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#[vV]}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is geen geldige versie (verwacht vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # Verse Europese IP-ranges meenemen in de release (zie geo-data.yml).
      # Is een RIR-server onbereikbaar, dan gaat de release door met de
      # bestaande ranges.
      - name: Geo-data bijwerken
        id: geo
        continue-on-error: true
        run: php tools/build_geo_europe.php

      - name: version.php bijwerken en tag verplaatsen
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          GEO_OUTCOME: ${{ steps.geo.outcome }}
        run: |
          sed -i -E "s/(APP_VERSION\s*=\s*')[^']*(')/\1${VERSION}\2/" includes/version.php
          grep -q "APP_VERSION = '${VERSION}'" includes/version.php || {
            echo "::error file=includes/version.php::APP_VERSION niet gevonden/bijgewerkt"
            exit 1
          }
          git add includes/version.php

          # Geo-data alleen meenemen als het script helemaal geslaagd is (bij
          # een fout halverwege kan één van de twee bestanden al vervangen
          # zijn) en de ranges zelf veranderd zijn — GENERATED.txt krijgt
          # altijd een nieuwe tijdstempel. De rest van includes/geo/ terugzetten.
          if [ "$GEO_OUTCOME" != "success" ]; then
            echo "::warning::Geo-data bijwerken mislukt; release gebruikt de bestaande IP-ranges."
          elif ! git diff --quiet -- 'includes/geo/*.bin'; then
            git add includes/geo/
          fi
          git checkout -- includes/geo/

          if git diff --cached --quiet; then
            echo "APP_VERSION en geo-data zijn al actueel, tag blijft staan."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Versie ${VERSION}"
            git tag -f "$TAG"
            # Tags gepusht met GITHUB_TOKEN starten geen nieuwe workflow-run, dus geen lus.
            git push -f origin "refs/tags/${TAG}"
          fi

          # main bijwerken, maar alleen als dat een fast-forward is (tag op de
          # laatste commit van main). Anders main niet aanraken.
          if git merge-base --is-ancestor origin/main HEAD; then
            git push origin HEAD:main
          else
            echo "::warning::Tag ${TAG} staat niet op de laatste commit van main; main is niet bijgewerkt. Pas APP_VERSION daar zelf aan."
          fi

      - name: GitHub-release aanmaken (als die nog niet bestaat)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} bestaat al."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
